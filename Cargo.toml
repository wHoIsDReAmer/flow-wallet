[package]
name = "flow-wallet"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tokio = { version = "1.51.1", features = ["rt", "rt-multi-thread", "macros"] }

[dependencies]

# signing
k256 = "0.13.4"
sha2 = "0.11.0"
sha3 = "0.11.0"
bs58 = "0.5.1"
hex = "0.4.3"

bip39 = "2.2.2"
bip32 = "0.5.3"
rand = "0.10.0"

# async runtime
async-trait = "0.1.89"

# error processor
thiserror = "2.0.18"

# http client & serialization
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_family = "unix")'.dependencies]
# system calls
libc = "0.2"
